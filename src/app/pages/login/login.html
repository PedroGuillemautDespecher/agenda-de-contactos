
      <section class="login-page">
        <div class="login-card">
          <h1 class="login-title">Agenda de contactos</h1>
      
          <form class="login-form" (submit)="login($event)">
            <div class="input-group">
              <input type="email" [formField]="formLogin.email" id="email" placeholder="Correo electrónico*">
            </div>
      
            <div class="input-group">
              <input type="password" [formField]="formLogin.password" id="password" placeholder="Contraseña*">
            </div>
      
            <button type="submit" class="login-btn">Login</button>
          </form>
      
          <p class="register-text">
            ¿No tenés cuenta? <a routerLink="/register" class="register-link">Regístrate</a>.
          </p>
        </div>
      </section>
